parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: containerName
    type: string

steps:
  - checkout: self
  - task: AzureCLI@2
    displayName: Deploy and verify ingestion worker
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az container create \
          --resource-group "$CONTAINER_RESOURCE_GROUP" --name "$CONTAINER_NAME" \
          --image "$RELEASE_IMAGE" --cpu 1 --memory 8 --os-type Linux \
          --registry-login-server "$ACR_SERVER" \
          --registry-username "$ACR_USER" --registry-password "$ACR_PASS" \
          --environment-variables \
            "LLM_EMBEDDING_MODEL=$LLM_EMBEDDING_MODEL" \
            "ELASTIC_URL=$ELASTIC_URL" "ELASTIC_INDEX=$ELASTIC_INDEX" \
          --secure-environment-variables \
            "LLM_API_KEY=$LLM_API_KEY" "DATABASE_URL=$DATABASE_URL" \
            "ELASTIC_WRITE_USERNAME=$ELASTIC_WRITE_USERNAME" \
            "ELASTIC_WRITE_PASSWORD=$ELASTIC_WRITE_PASSWORD" \
          --output none
        python3 deploy/scripts/verify.py worker \
          --resource-group "$CONTAINER_RESOURCE_GROUP" --name "$CONTAINER_NAME" \
          --image "$RELEASE_IMAGE" --revision "$BUILD_SOURCEVERSION"
    env:
      CONTAINER_RESOURCE_GROUP: ${{ parameters.resourceGroup }}
      CONTAINER_NAME: ${{ parameters.containerName }}
      RELEASE_IMAGE: $(imageUri)
      ACR_SERVER: $(acrLoginServer)
      ACR_USER: $(ACR_USER)
      ACR_PASS: $(ACR_PASS)
      LLM_EMBEDDING_MODEL: $(LLM_EMBEDDING_MODEL)
      ELASTIC_URL: $(ELASTIC_URL)
      ELASTIC_INDEX: $(ELASTIC_INDEX)
      LLM_API_KEY: $(LLM_API_KEY)
      DATABASE_URL: $(DATABASE_URL)
      ELASTIC_WRITE_USERNAME: $(ELASTIC_WRITE_USERNAME)
      ELASTIC_WRITE_PASSWORD: $(ELASTIC_WRITE_PASSWORD)
