parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: appName
    type: string
  - name: url
    type: string

steps:
  - checkout: self
  - task: AzureWebAppContainer@1
    displayName: Deploy frontend image
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      appName: ${{ parameters.appName }}
      containers: $(imageUri)
  - task: AzureCLI@2
    displayName: Verify deployed frontend and enable health monitoring
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        python3 deploy/scripts/verify.py web --url "$APP_URL" --revision "$BUILD_SOURCEVERSION"
        # Enable the probe only after the new image serves it successfully.
        az webapp config set --resource-group "$APP_RESOURCE_GROUP" --name "$APP_NAME" \
          --always-on true --generic-configurations '{"healthCheckPath":"/api/health"}' --output none
        python3 deploy/scripts/verify.py web --url "$APP_URL" --revision "$BUILD_SOURCEVERSION"
    env:
      APP_URL: ${{ parameters.url }}
      APP_RESOURCE_GROUP: ${{ parameters.resourceGroup }}
      APP_NAME: ${{ parameters.appName }}
