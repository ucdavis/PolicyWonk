trigger:
  branches: { include: [main] }
  paths:
    include: [backend/**, azure-pipelines-backend.yml, deploy/templates/**, deploy/scripts/**, deploy/tests/**]

# Run every PR so the required check always reports a result.
pr:
  branches: { include: [main] }

variables:
  acrLoginServer: policywonkcontainers.azurecr.io
  imageRepo: policybackend
  imageTag: $(Build.SourceVersion)
  imageUri: $(acrLoginServer)/$(imageRepo):$(imageTag)
  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

stages:
  - stage: BuildPush
    displayName: Validate and build ingestion worker
    jobs:
      - job: BuildPushJob
        pool: { vmImage: ubuntu-latest }
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
          - script: |
              set -euo pipefail
              python -m compileall -q backend
              python -m unittest discover -s deploy/tests -v
            displayName: Check Python and test deployment verification
          - task: Docker@2
            displayName: Build ingestion image
            inputs:
              command: build
              dockerfile: backend/Dockerfile
              buildContext: backend
              repository: $(imageRepo)
              arguments: -t $(imageUri) --build-arg BUILD_REVISION=$(Build.SourceVersion)
          - task: Docker@2
            displayName: Push ingestion image
            condition: and(succeeded(), eq(variables.isMain, true))
            inputs:
              command: push
              repository: $(imageRepo)
              tags: $(imageTag)
              containerRegistry: CaesProductionPolicyWonkContainerConnection

  - stage: DeployTest
    displayName: Deploy and verify TEST worker
    dependsOn: BuildPush
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - deployment: DeployTest
        environment: test
        pool: { vmImage: ubuntu-latest }
        variables:
          - group: Backend-Dev
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy/templates/worker-deploy.yml
                  parameters:
                    serviceConnection: CaesTestDeploy
                    resourceGroup: policywonk-dev
                    containerName: policywonk-dev-backend

  - stage: TestAcceptance
    displayName: Confirm TEST ingestion acceptance
    dependsOn: DeployTest
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - template: deploy/templates/acceptance.yml
        parameters:
          instructions: |
            Follow the controlled test ingestion procedure in deploy/README.md.
            Confirm a designated test source completed successfully after this deployment,
            check its document and vectors, and retrieve it through the test website.
            Record the run's commit and evidence in the approval comment. Reject on failure.
            A Running container alone is insufficient. Acceptance expires after 24 hours.

  - stage: DeployProd
    displayName: Deploy and verify PROD worker
    dependsOn: TestAcceptance
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - deployment: DeployProd
        environment: prod
        pool: { vmImage: ubuntu-latest }
        variables:
          - group: Backend-Prod
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy/templates/worker-deploy.yml
                  parameters:
                    serviceConnection: CaesProductionDeployPrincipal
                    resourceGroup: policy
                    containerName: policywonk-prod-backend

  - stage: ReleaseSummary
    displayName: Release outcome
    dependsOn: [BuildPush, DeployTest, TestAcceptance, DeployProd]
    condition: and(always(), eq(variables.isMain, true))
    variables:
      buildResult: $[ dependencies.BuildPush.result ]
      testResult: $[ dependencies.DeployTest.result ]
      acceptanceResult: $[ dependencies.TestAcceptance.result ]
      prodResult: $[ dependencies.DeployProd.result ]
    jobs:
      - template: deploy/templates/release-summary.yml
