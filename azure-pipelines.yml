# We'll build on `main` and PR changes.
# Main only, we push to ACR (docker container) and deploy to test
# Then prod deployment will start after proper approvals (setup via GUI)
# Build when this component or its pipeline changes.
trigger:
  branches: { include: ['main'] }
  paths:    { include: ['web/**', 'azure-pipelines.yml'] }

pr:
  branches: { include: ['main'] }
  paths:    { include: ['web/**', 'azure-pipelines.yml'] }

variables:
  acrLoginServer: policywonkcontainers.azurecr.io
  imageRepo: policywonk
  imageTag: $(Build.SourceVersion)                     # commit SHA
  imageUri: $(acrLoginServer)/$(imageRepo):$(imageTag)
  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

stages:
# ─────────────────────── 1) BUILD (+ PUSH on main only) ───────────────────────
- stage: BuildPush
  displayName: Build and push on main changes
  jobs:
  - job: BuildPushJob
    displayName: Build (always) / Push (main only)
    pool: { vmImage: ubuntu-latest }
    steps:
    - checkout: self

    # --- Build image (always) ---
    - task: Docker@2
      displayName: docker build
      inputs:
        command: build
        dockerfile: web/Dockerfile
        repository: $(imageRepo)
        arguments: -t $(imageUri)

    # --- Login & push image (only on main) ---
    - task: Docker@2
      displayName: docker push
      condition: and(succeeded(), eq(variables.isMain, 'True'))
      inputs:
        command: push
        repository: $(imageRepo)
        tags: |
          $(imageTag)
        containerRegistry: CaesProductionPolicyWonkContainerConnection # Docker-registry SC

# ─────────────────────── 2) DEPLOY to TEST ───────────────────────
- stage: DeployTest
  displayName: Deploy to TEST
  dependsOn: BuildPush
  condition: and(succeeded(), eq(variables.isMain, 'True'))      # skip on PRs
  jobs:
  - deployment: DeployTest
    environment: test
    pool: { vmImage: ubuntu-latest }
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            inputs:
              azureSubscription: CaesTestDeploy
              appName: policywonk-test
              containers: $(imageUri)
          - bash: |
              set -e
              status=$(curl --fail --silent --show-error --retry 12 --retry-all-errors \
                --retry-delay 10 --max-time 30 --output /dev/null --write-out '%{http_code}' \
                https://policywonk-test.azurewebsites.net/auth/login)
              test "$status" = "200"
            displayName: Check TEST login page responds

# ─────────────────────── 3) DEPLOY to PROD (gated) ───────────────────────
- stage: DeployProd
  displayName: Deploy to PROD
  dependsOn: DeployTest
  condition: and(succeeded(), eq(variables.isMain, 'True'))
  jobs:
  - deployment: DeployProd
    environment: prod                 # Existing CAES Developers approval
    pool: { vmImage: ubuntu-latest }
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            inputs:
              azureSubscription: CaesProductionDeployPrincipal
              appName: policywonk
              containers: $(imageUri)
          - bash: |
              set -e
              status=$(curl --fail --silent --show-error --retry 12 --retry-all-errors \
                --retry-delay 10 --max-time 30 --output /dev/null --write-out '%{http_code}' \
                https://policywonk.ucdavis.edu/auth/login)
              test "$status" = "200"
            displayName: Check PROD login page responds
