# Azure Pipelines owns deployments. GitHub Actions provides CodeQL scanning.
trigger:
  branches: { include: [main] }
  paths:
    include: [web/**, azure-pipelines.yml, deploy/templates/**, deploy/scripts/**, deploy/tests/**]

# Run every PR so the required check always reports a result.
pr:
  branches: { include: [main] }

variables:
  acrLoginServer: policywonkcontainers.azurecr.io
  imageRepo: policywonk
  imageTag: $(Build.SourceVersion)
  imageUri: $(acrLoginServer)/$(imageRepo):$(imageTag)
  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

stages:
  - stage: BuildPush
    displayName: Validate and build frontend
    jobs:
      - job: BuildPushJob
        pool: { vmImage: ubuntu-latest }
        steps:
          - checkout: self
          - task: NodeTool@0
            inputs:
              versionSpec: 20.x
          - script: |
              set -euo pipefail
              npm ci
              npx prisma generate
              npm run lint
              npm test
            workingDirectory: web
            displayName: Install, lint, and test frontend
          - script: python3 -m unittest discover -s deploy/tests -v
            displayName: Test deployment verification
          - task: Docker@2
            displayName: Build frontend image
            inputs:
              command: build
              dockerfile: web/Dockerfile
              buildContext: web
              repository: $(imageRepo)
              arguments: -t $(imageUri) --build-arg BUILD_REVISION=$(Build.SourceVersion)
          - task: Docker@2
            displayName: Push frontend image
            condition: and(succeeded(), eq(variables.isMain, true))
            inputs:
              command: push
              repository: $(imageRepo)
              tags: $(imageTag)
              containerRegistry: CaesProductionPolicyWonkContainerConnection

  - stage: DeployTest
    displayName: Deploy and verify TEST
    dependsOn: BuildPush
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - deployment: DeployTest
        environment: test
        pool: { vmImage: ubuntu-latest }
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy/templates/web-deploy.yml
                  parameters:
                    serviceConnection: CaesTestDeploy
                    resourceGroup: policywonk-dev
                    appName: policywonk-test
                    url: https://policywonk-test.azurewebsites.net

  - stage: TestAcceptance
    displayName: Confirm TEST acceptance
    dependsOn: DeployTest
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - template: deploy/templates/acceptance.yml
        parameters:
          instructions: |
            Check this run's commit at https://policywonk-test.azurewebsites.net/api/health.
            Follow deploy/README.md: sign in through SSO, ask a policy question,
            verify streaming and citations, then reload and reopen the saved chat.
            Record results and the commit in the approval comment. Reject if any check fails.
            Acceptance expires after 24 hours. Production still requires its environment approval.

  - stage: DeployProd
    displayName: Deploy and verify PROD
    dependsOn: TestAcceptance
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - deployment: DeployProd
        environment: prod
        pool: { vmImage: ubuntu-latest }
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deploy/templates/web-deploy.yml
                  parameters:
                    serviceConnection: CaesProductionDeployPrincipal
                    resourceGroup: policy
                    appName: policywonk
                    url: https://policywonk.ucdavis.edu

  - stage: ReleaseSummary
    displayName: Release outcome
    dependsOn: [BuildPush, DeployTest, TestAcceptance, DeployProd]
    condition: and(always(), eq(variables.isMain, true))
    variables:
      buildResult: $[ dependencies.BuildPush.result ]
      testResult: $[ dependencies.DeployTest.result ]
      acceptanceResult: $[ dependencies.TestAcceptance.result ]
      prodResult: $[ dependencies.DeployProd.result ]
    jobs:
      - template: deploy/templates/release-summary.yml
